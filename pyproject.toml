[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "disc-bot"
version = "0.1.0"
description = "Personal Discord planner bot: schedule reminders for today and tomorrow."
requires-python = ">=3.11"
dependencies = [
    "discord.py>=2.4,<3",
    "python-dotenv>=1.0",
    # Windows has no system IANA timezone database; zoneinfo needs this.
    "tzdata>=2024.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["bot"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
